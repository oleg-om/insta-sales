name: Deploy to Production (with Docker Hub)

# Этот workflow использует Docker Hub для хранения образов
# Если у вас нет Docker Hub, используйте deploy-ssh.yml

on:
  workflow_dispatch:  # Только ручной запуск

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/insta-sales-backend:latest,${{ secrets.DOCKER_USERNAME }}/insta-sales-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/insta-sales-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/insta-sales-backend:buildcache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          tags: ${{ secrets.DOCKER_USERNAME }}/insta-sales-frontend:latest,${{ secrets.DOCKER_USERNAME }}/insta-sales-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/insta-sales-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/insta-sales-frontend:buildcache,mode=max

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /opt/insta-sales
            
            # Pull latest images
            docker pull ${{ secrets.DOCKER_USERNAME }}/insta-sales-backend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/insta-sales-frontend:latest
            
            # Update docker-compose file
            cat > docker-compose.yml << 'EOF'
            services:
              postgres:
                image: postgres:16-alpine
                container_name: insta-sales-db
                environment:
                  POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
                  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                  POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                networks:
                  - insta-sales-network
                restart: always

              backend:
                image: ${{ secrets.DOCKER_USERNAME }}/insta-sales-backend:latest
                container_name: insta-sales-backend
                environment:
                  DATABASE_URL: postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/${{ secrets.POSTGRES_DB }}
                  JWT_SECRET: ${{ secrets.JWT_SECRET }}
                  INSTAGRAM_CLIENT_ID: ${{ secrets.INSTAGRAM_CLIENT_ID }}
                  INSTAGRAM_CLIENT_SECRET: ${{ secrets.INSTAGRAM_CLIENT_SECRET }}
                  INSTAGRAM_REDIRECT_URI: ${{ secrets.INSTAGRAM_REDIRECT_URI }}
                  PORT: 3001
                  NODE_ENV: production
                depends_on:
                  - postgres
                networks:
                  - insta-sales-network
                restart: always

              frontend:
                image: ${{ secrets.DOCKER_USERNAME }}/insta-sales-frontend:latest
                container_name: insta-sales-frontend
                ports:
                  - "80:80"
                depends_on:
                  - backend
                networks:
                  - insta-sales-network
                restart: always

            volumes:
              postgres_data:

            networks:
              insta-sales-network:
                driver: bridge
            EOF
            
            # Stop and remove old containers
            docker-compose down
            
            # Start new containers
            docker-compose up -d
            
            # Run migrations
            docker exec insta-sales-backend node dist/db/migrate.js || true
            
            # Clean up old images
            docker image prune -af --filter "until=24h"

      - name: Notify deployment status
        if: always()
        run: |
          echo "Deployment ${{ job.status }}"
