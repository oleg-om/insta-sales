name: Deploy via SSH

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            
            echo "🚀 Starting deployment..."
            
            # Navigate to app directory
            APP_DIR="/opt/insta-sales"
            mkdir -p $APP_DIR
            cd $APP_DIR
            
            # Clone or pull repository
            if [ -d ".git" ]; then
              echo "📥 Pulling latest changes..."
              git fetch origin
              git reset --hard origin/main
            else
              echo "📥 Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git .
            fi
            
            # App config: use .env in project root on the server (not in git; create manually once)
            echo "🔐 Checking .env on server..."
            if [ ! -f .env ]; then
              echo "❌ ERROR: .env is missing in $APP_DIR"
              echo "Create it on the server (see .env.example): POSTGRES_*, DATABASE_URL, JWT_SECRET, FRONTEND_URL, Instagram vars."
              exit 1
            fi
            if ! grep -qE '^[[:space:]]*DATABASE_URL=' .env || ! grep -qE '^[[:space:]]*JWT_SECRET=' .env; then
              echo "❌ ERROR: .env must define DATABASE_URL and JWT_SECRET"
              exit 1
            fi
            echo "✅ Using existing .env (not overwritten by this workflow)"
            
            # Stop old containers
            echo "🛑 Stopping old containers..."
            docker compose down || true
            
            # Build new images
            echo "🔨 Building Docker images..."
            docker compose build --no-cache
            
            # Start database first
            echo "🗄️  Starting database..."
            docker compose up -d postgres
            
            # Wait for database
            echo "⏳ Waiting for database to be ready..."
            sleep 15
            
            # Migrations via one-off container (exec fails if backend is crash-looping)
            echo "🔄 Running database migrations..."
            docker compose run --rm --no-deps -T backend npx prisma migrate deploy
            echo "✅ Migrations applied successfully"
            
            # Start app (backend needs DB schema from migrations above)
            echo "▶️  Starting all services..."
            docker compose up -d
            
            # Wait for services to fully start
            echo "⏳ Waiting for services to start..."
            sleep 15
            
            # Check backend health
            echo "🏥 Checking backend health..."
            MAX_TRIES=10
            TRIES=0
            while [ $TRIES -lt $MAX_TRIES ]; do
              if docker exec insta-sales-backend wget --no-verbose --tries=1 --spider http://localhost:3001/health 2>/dev/null; then
                echo "✅ Backend is healthy"
                break
              fi
              TRIES=$((TRIES+1))
              if [ $TRIES -lt $MAX_TRIES ]; then
                echo "⏳ Backend not ready yet, retrying... ($TRIES/$MAX_TRIES)"
                sleep 5
              else
                echo "⚠️  Backend health check failed after $MAX_TRIES attempts"
              fi
            done
            
            # Check services status
            echo ""
            echo "📊 Services status:"
            docker compose ps
            
            # Show recent logs
            echo ""
            echo "📝 Recent backend logs:"
            docker compose logs --tail=20 backend
            
            # Clean up old images
            echo ""
            echo "🧹 Cleaning up old images..."
            docker image prune -af --filter "until=24h" || true
            
            echo ""
            echo "🎉 Deployment completed successfully!"
            echo ""
            echo "📍 Check FRONTEND_URL in your server .env for the public URL"

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Deployment successful (URLs are configured in server .env)"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs above for details."
