name: Deploy via SSH

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'instasales' }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'instasales' }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          INSTAGRAM_CLIENT_ID: ${{ secrets.INSTAGRAM_CLIENT_ID }}
          INSTAGRAM_CLIENT_SECRET: ${{ secrets.INSTAGRAM_CLIENT_SECRET }}
          INSTAGRAM_REDIRECT_URI: ${{ secrets.INSTAGRAM_REDIRECT_URI }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'http://localhost' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,JWT_SECRET,INSTAGRAM_CLIENT_ID,INSTAGRAM_CLIENT_SECRET,INSTAGRAM_REDIRECT_URI,FRONTEND_URL
          script: |
            set -e
            
            echo "🚀 Starting deployment..."
            
            # Navigate to app directory
            APP_DIR="/opt/insta-sales"
            mkdir -p $APP_DIR
            cd $APP_DIR
            
            # Clone or pull repository
            if [ -d ".git" ]; then
              echo "📥 Pulling latest changes..."
              git fetch origin
              git reset --hard origin/main
            else
              echo "📥 Cloning repository..."
              git clone https://github.com/${{ github.repository }}.git .
            fi
            
            # Check required secrets
            echo "🔐 Checking required secrets..."
            if [ -z "$POSTGRES_PASSWORD" ]; then
              echo "❌ ERROR: POSTGRES_PASSWORD secret is not set!"
              echo "Please add it in GitHub Settings → Secrets → Actions"
              exit 1
            fi
            
            if [ -z "$JWT_SECRET" ]; then
              echo "❌ ERROR: JWT_SECRET secret is not set!"
              echo "Please add it in GitHub Settings → Secrets → Actions"
              exit 1
            fi
            
            # Update .env file with all secrets
            echo "📝 Creating .env file..."
            # Percent-encode credentials for DATABASE_URL (Prisma P1013 if e.g. @ : # or spaces in password)
            if ! command -v python3 >/dev/null 2>&1; then
              echo "❌ ERROR: python3 is required on the server to build DATABASE_URL"
              exit 1
            fi
            _pq_urlencode() {
              python3 -c "import sys, urllib.parse; print(urllib.parse.quote(sys.stdin.read(), safe=''))"
            }
            ENC_PG_USER=$(printf '%s' "$POSTGRES_USER" | _pq_urlencode)
            ENC_PG_PASS=$(printf '%s' "$POSTGRES_PASSWORD" | _pq_urlencode)
            ENC_PG_DB=$(printf '%s' "$POSTGRES_DB" | _pq_urlencode)
            {
              echo "# Database"
              echo "POSTGRES_USER=${POSTGRES_USER}"
              echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
              echo "POSTGRES_DB=${POSTGRES_DB}"
              echo "DATABASE_URL=postgresql://${ENC_PG_USER}:${ENC_PG_PASS}@postgres:5432/${ENC_PG_DB}"
              echo ""
              echo "# Server"
              echo "PORT=3001"
              echo "NODE_ENV=production"
              echo "JWT_SECRET=${JWT_SECRET}"
              echo ""
              echo "# Instagram OAuth"
              echo "INSTAGRAM_CLIENT_ID=${INSTAGRAM_CLIENT_ID}"
              echo "INSTAGRAM_CLIENT_SECRET=${INSTAGRAM_CLIENT_SECRET}"
              echo "INSTAGRAM_REDIRECT_URI=${INSTAGRAM_REDIRECT_URI}"
              echo ""
              echo "# Frontend"
              echo "FRONTEND_URL=${FRONTEND_URL}"
            } > .env
            
            # Verify DATABASE_URL format
            echo "🔍 Verifying DATABASE_URL format..."
            DB_URL=$(grep DATABASE_URL .env | cut -d= -f2-)
            if echo "$DB_URL" | grep -q "postgresql://.*:.*@postgres:5432/"; then
              echo "✅ DATABASE_URL format looks correct"
            else
              echo "❌ ERROR: DATABASE_URL format is invalid!"
              echo "Check that POSTGRES_PASSWORD is set correctly in GitHub Secrets"
              echo "DATABASE_URL: $(echo $DB_URL | sed 's/:.*@/:****@/')"
              exit 1
            fi
            
            # Stop old containers
            echo "🛑 Stopping old containers..."
            docker compose down || true
            
            # Build new images
            echo "🔨 Building Docker images..."
            docker compose build --no-cache
            
            # Start database first
            echo "🗄️  Starting database..."
            docker compose up -d postgres
            
            # Wait for database
            echo "⏳ Waiting for database to be ready..."
            sleep 15
            
            # Start all services
            echo "▶️  Starting all services..."
            docker compose up -d
            
            # Wait a bit for backend container to be ready
            echo "⏳ Waiting for backend container..."
            sleep 10
            
            # Run migrations (backend container must be running)
            echo "🔄 Running database migrations..."
            if docker compose exec backend npx prisma migrate deploy; then
              echo "✅ Migrations applied successfully"
            else
              echo "⚠️  Migration failed - continuing anyway (tables might already exist)"
            fi
            
            # Restart backend after migrations
            echo "🔄 Restarting backend..."
            docker compose restart backend
            
            # Wait for services to fully start
            echo "⏳ Waiting for services to start..."
            sleep 15
            
            # Check backend health
            echo "🏥 Checking backend health..."
            MAX_TRIES=10
            TRIES=0
            while [ $TRIES -lt $MAX_TRIES ]; do
              if docker exec insta-sales-backend wget --no-verbose --tries=1 --spider http://localhost:3001/health 2>/dev/null; then
                echo "✅ Backend is healthy"
                break
              fi
              TRIES=$((TRIES+1))
              if [ $TRIES -lt $MAX_TRIES ]; then
                echo "⏳ Backend not ready yet, retrying... ($TRIES/$MAX_TRIES)"
                sleep 5
              else
                echo "⚠️  Backend health check failed after $MAX_TRIES attempts"
              fi
            done
            
            # Check services status
            echo ""
            echo "📊 Services status:"
            docker compose ps
            
            # Show recent logs
            echo ""
            echo "📝 Recent backend logs:"
            docker compose logs --tail=20 backend
            
            # Clean up old images
            echo ""
            echo "🧹 Cleaning up old images..."
            docker image prune -af --filter "until=24h" || true
            
            echo ""
            echo "🎉 Deployment completed successfully!"
            echo ""
            echo "📍 Application should be available at: ${{ secrets.FRONTEND_URL || 'http://your-server' }}"

      - name: Notify on success
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 Frontend: ${{ secrets.FRONTEND_URL || 'http://your-server' }}"
          echo "🔌 Backend: ${{ secrets.FRONTEND_URL || 'http://your-server' }}/health"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs above for details."
